title: mcp-mealie
description: >-
  A curated, token-efficient MCP server for Mealie recipes, meal plans,
  cookbooks, and library cleanup.
url: https://mgummich.github.io
baseurl: /mcp-mealie

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# The site is the README, the howto, and the changelog, reached through the
# wrapper pages that give them permalinks. Everything else — code, tests,
# packaging, and the docs written for developers and agents — is not part of it.
exclude:
  - src/
  - tests/
  - scripts/
  - .venv/
  - .github/
  - pyproject.toml
  - uv.lock
  - AGENTS.md
  - CONTRIBUTING.md
  - SECURITY.md
  - docs/ARCHITECTURE.md
  - docs/RELEASING.md
  - docs/REPO_AUDIT.md
  - docs/archive/

defaults:
  - scope:
      path: ""
    values:
      layout: default
