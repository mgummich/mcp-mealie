[project]
name = "mcp-mealie"
dynamic = ["version"]
description = "MCP server for Mealie: curated, token-efficient tools for recipes, meal plans, and cookbooks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "moreno" }]
keywords = ["mcp", "mealie", "recipes", "meal-planning", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["fastmcp>=2.10", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/mgummich/mcp-mealie"
Repository = "https://github.com/mgummich/mcp-mealie"
Issues = "https://github.com/mgummich/mcp-mealie/issues"
Changelog = "https://github.com/mgummich/mcp-mealie/blob/main/CHANGELOG.md"

[project.scripts]
mcp-mealie = "mealie_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mealie_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mealie_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
