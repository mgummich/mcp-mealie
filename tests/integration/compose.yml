services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:${MEALIE_TEST_VERSION:-v3.25.1}
    ports:
      # Not 9925: that is the port Mealie's own docs use, so a developer's
      # real local instance would collide.
      # Loopback only: the container runs with default credentials.
      - "127.0.0.1:19925:9000"
    environment:
      ALLOW_SIGNUP: "false"
