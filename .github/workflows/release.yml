name: Release

on:
  push:
    tags: ["v*"]

# One job: the gates, the build, and the release all read the same checkout,
# so splitting them only bought artifact passing between runners.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous tag, for the compare link
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Tag must match __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/mealie_mcp/__init__.py)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match __version__ $version" >&2
            exit 1
          fi

      # The same fast gate CI runs on every push. pytest also pins the install
      # tag in the docs to __version__, so a half-bumped release fails here
      # rather than shipping.
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev ruff format --check .
      - run: uv run --extra dev mypy
      - run: uv run --extra dev pytest

      - run: uv build

      # The changelog section is the body; the install block and the footer
      # are derived from the tag, so every release reads the same way without
      # anyone remembering to write them. See docs/RELEASING.md.
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo="https://github.com/${GITHUB_REPOSITORY}"
          # The section for this version, up to the next "## " heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > body.md
          if [ ! -s body.md ]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          {
            echo '## 🚀 Install'
            echo
            echo '```json'
            echo '{'
            echo '  "command": "uvx",'
            echo "  \"args\": [\"--from\", \"git+${repo}@${GITHUB_REF_NAME}\", \"mcp-mealie\"],"
            echo '  "env": { "MEALIE_URL": "https://mealie.example.com", "MEALIE_API_TOKEN": "your-token" }'
            echo '}'
            echo '```'
            echo
            echo 'Upgrading? Change the tag, then `uv cache clean mcp-mealie` and restart the'
            echo 'client — `uvx` otherwise keeps serving the revision it first resolved.'
            echo
            cat body.md
            echo '---'
            echo
            printf '📖 [Changelog](%s/blob/main/CHANGELOG.md)' "$repo"
            if [ -n "$previous" ]; then
              printf ' · 🔍 [Full diff](%s/compare/%s...%s)' "$repo" "$previous" "$GITHUB_REF_NAME"
            fi
            printf ' · 🎓 [Agent skill](https://github.com/mgummich/mealie-skill)\n'
          } > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*
